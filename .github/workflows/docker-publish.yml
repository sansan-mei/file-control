name: Docker build and publish

on:
  push:
    branches: [master, ci/docker-publish]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  docker:
    if: github.repository == 'sansan-mei/file-control'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: 1596944197/file-server
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine publication eligibility
        id: publish
        env:
          DOCKERHUB_TOKEN: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.DOCKERHUB_TOKEN || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            if [[ -n "$DOCKERHUB_TOKEN" ]]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo '::warning::DOCKERHUB_TOKEN is missing; validating the image without login or push.'
            fi
          else
            echo 'Feature branch or pull request: build-only validation, no login or push.'
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: file-server:ci
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/sansan-mei/file-control
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=file-server-amd64
          cache-to: type=gha,mode=max,scope=file-server-amd64

      - name: Verify packaged application without production services
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint sh file-server:ci -ec '
            node --check /app/index.mjs
            test -s /app/public/index.html
            test -d /app/static
            test ! -e /app/.env
            test ! -e /app/service/.env
          '

      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: '1596944197'
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Push the verified image
        if: steps.publish.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker tag file-server:ci "$IMAGE:sha-$GITHUB_SHA"
          docker tag file-server:ci "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Record result
        env:
          PUBLISHED: ${{ steps.publish.outputs.enabled }}
        shell: bash
        run: |
          {
            echo '### File Control Docker verification'
            echo "- Commit: $GITHUB_SHA"
            echo '- Platform: linux/amd64'
            echo '- Checked packaged JavaScript syntax and frontend assets offline; no Redis or production service was contacted.'
            if [[ "$PUBLISHED" == 'true' ]]; then
              echo "- Pushed $IMAGE:latest and $IMAGE:sha-$GITHUB_SHA."
            else
              echo '- Build-only validation; no registry login or push.'
            fi
            echo '- No production deployment or container restart.'
          } >> "$GITHUB_STEP_SUMMARY"
