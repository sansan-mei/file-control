name: Manual Docker build and publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    if: github.repository == 'sansan-mei/file-control' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: 1596944197/file-server
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require publication credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::DOCKERHUB_TOKEN is required for this manual publishing workflow.'
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: file-server:ci
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/sansan-mei/file-control
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=file-server-amd64
          cache-to: type=gha,mode=max,scope=file-server-amd64

      - name: Verify packaged application and PWA without production services
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint sh file-server:ci -ec '
            node --check /app/index.mjs
            test -s /app/public/index.html
            test -s /app/public/manifest.webmanifest
            test -s /app/public/sw.js
            test -s /app/public/icons/icon-192.png
            test -s /app/public/icons/icon-512.png
            test -d /app/static
            test ! -e /app/.env
            test ! -e /app/service/.env
          '

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: '1596944197'
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Push the verified image
        shell: bash
        run: |
          set -euo pipefail
          docker tag file-server:ci "$IMAGE:sha-$GITHUB_SHA"
          docker tag file-server:ci "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Record result
        shell: bash
        run: |
          {
            echo '### Manually published File Control image'
            echo "- Commit: $GITHUB_SHA"
            echo "- Published $IMAGE:latest and $IMAGE:sha-$GITHUB_SHA."
            echo '- Platform: linux/amd64'
            echo '- Packaged syntax and PWA assets checked offline; no production service contacted.'
            echo '- No production deployment or container restart was performed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
