name: Verify File Control

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install locked frontend and backend dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir service install --frozen-lockfile

      - name: Verify frontend and backend
        run: pnpm run ci:verify

      - name: Install Chromium for isolated browser regressions
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify UI, PWA and file operations with fixtures
        run: pnpm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
